[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sommelier-minicpmo45-train"
version = "0.1.0"
description = "Audio-to-text SFT for MiniCPM-o 4.5 using Sommelier exports"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "accelerate==1.7.0",
  "einops==0.8.1",
  "librosa==0.10.2.post1",
  "minicpmo-utils==1.0.6",
  "numpy==2.2.2",
  "peft==0.15.2",
  "PyYAML==6.0.2",
  "safetensors>=0.4.5",
  "soundfile==0.13.1",
  "timm==1.0.29",
  "torch>=2.8.0,<2.9",
  "torchaudio>=2.8.0,<2.9",
  "torchvision>=0.23.0,<0.24",
  "transformers==4.51.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
minicpmo-prepare = "minicpmo_train.prepare:main"
minicpmo-train = "minicpmo_train.train:main"
minicpmo-check = "minicpmo_train.check:main"
minicpmo-infer = "minicpmo_train.infer:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
