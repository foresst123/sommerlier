<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Nghe hội thoại</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2330;--mute:#667085;--line:#e3e6ec;--ok:#1a7f4b;--run:#2563eb;--bad:#c0392b;--warn:#b7791f;--sel:#e8effd;--hover:#eef1f6;--on:#fff;--name:76px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141b;--card:#171c25;--ink:#e6e9ef;--mute:#8b94a5;--line:#273041;--ok:#4cc38a;--run:#6ea0ff;--bad:#ff7a6b;--warn:#e0b24d;--sel:#1d2a44;--hover:#202836;--on:#0b1020}}
:root[data-theme="dark"]{--bg:#10141b;--card:#171c25;--ink:#e6e9ef;--mute:#8b94a5;--line:#273041;--ok:#4cc38a;--run:#6ea0ff;--bad:#ff7a6b;--warn:#e0b24d;--sel:#1d2a44;--hover:#202836;--on:#0b1020}
[hidden]{display:none !important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1280px;margin:0 auto;padding:12px 16px}
body.embedded #top{display:none}
body.embedded main{padding-top:8px}
a{color:var(--run)}
h1{font-size:17px;margin:0}
h2{font-size:15px;margin:0;overflow-wrap:anywhere;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input,select,button{font:inherit;color:inherit}
input[type=search],select{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);min-height:34px}
button:focus-visible,input:focus-visible,select:focus-visible,.turn:focus-visible,.row:focus-visible,a:focus-visible,canvas:focus-visible{outline:2px solid var(--run);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.bar input{flex:1 1 200px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip,.btn,.seg button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 11px;cursor:pointer;min-height:30px}
.chip[aria-pressed="true"]{background:var(--run);border-color:var(--run);color:var(--on)}
.chip .n{opacity:.75;margin-left:3px;font-variant-numeric:tabular-nums}
.btn{border-radius:8px}
.btn.primary{background:var(--run);border-color:var(--run);color:var(--on);min-width:96px}
.btn.wide{width:100%;margin-top:6px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:30px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--run);font-weight:600}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.layout{display:grid;grid-template-columns:minmax(250px,340px) minmax(0,1fr);gap:12px;align-items:start}
.layout>*{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.list{max-height:calc(100vh - 150px);min-height:120px;overflow:auto}
.row{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:7px;padding:4px 8px;cursor:pointer;margin-bottom:2px}
.row:hover{background:var(--hover)}
.row[aria-current="true"]{background:var(--sel);border-color:var(--run)}
.t1{display:flex;align-items:center;gap:6px;min-width:0}
.title{flex:1;min-width:0;font-weight:600;font-size:13px;line-height:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.meta{display:flex;flex-wrap:wrap;gap:0 8px;align-items:center;color:var(--mute);font-size:11px;line-height:15px}
.badge{font-size:10px;line-height:14px;border:1px solid currentColor;border-radius:999px;padding:0 6px;white-space:nowrap}
.cat-interrupt{color:var(--warn)}.cat-backchannel{color:var(--run)}.cat-turn_by_turn{color:var(--ok)}
.note{color:var(--mute);font-size:12px}
.err{color:var(--bad);font-size:12px;min-height:1em}
.ctrls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.btn.sm{min-height:28px;padding:2px 9px}
#psum{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
audio{display:block;width:100%;height:32px;margin-top:6px}
/* lanes */
.lanes{margin-top:6px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card);user-select:none}
.lrow{display:flex;align-items:stretch;border-top:1px dashed var(--line)}
.lrow:first-child{border-top:0}
.lname{width:var(--name);flex:none;font-size:11px;color:var(--mute);display:flex;align-items:center;gap:4px;padding:0 6px;overflow:hidden;white-space:nowrap}
.sw{display:inline-block;width:8px;height:8px;border-radius:2px;flex:none}
.lrow canvas{flex:1;min-width:0;display:block;cursor:pointer}
.c-ruler{height:18px}.c-wave{height:40px}.c-text{height:20px}.c-ev{height:14px}
.hrow{display:flex;border-top:1px solid var(--line)}
#hscroll{flex:1;min-width:0;height:14px;overflow-x:auto;overflow-y:hidden}
#hspacer{height:1px}
#lanetip{min-height:16px;margin-top:4px;font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tr{height:160px;overflow:auto;margin-top:4px;border:1px solid var(--line);border-radius:8px;padding:2px}
.turn{display:block;width:100%;height:20px;line-height:20px;text-align:left;border:0;background:none;padding:0 6px;border-radius:4px;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12px}
.turn:hover{background:var(--hover)}
.turn.on{background:var(--sel)}
.ts{color:var(--mute);font-variant-numeric:tabular-nums;margin-right:4px}
.who{font-weight:600;margin-right:4px}
.ca{color:var(--run)}.cu{color:var(--ok)}
.dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:2px 10px;margin:8px 0 0;font-size:12px}
.dl dt{color:var(--mute)}
.dl dd{margin:0;overflow-wrap:anywhere}
/* review sample: modes, grading, input-output card */
.leftcol{display:flex;flex-direction:column;gap:10px;min-width:0}
input[type=number],input[type=text]{padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);min-height:32px;min-width:0}
.iohead{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.iotog{border:0;background:none;padding:2px 0;font-weight:600;cursor:pointer;color:var(--ink)}
.iosum{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iorow{margin-top:4px;overflow-wrap:anywhere}
.iocat{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:4px;color:var(--mute);font-size:12px}
.tw{max-height:160px;overflow:auto;margin-top:6px;border:1px solid var(--line);border-radius:8px}
.ftab{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px}
.ftab th,.ftab td{padding:3px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ftab th{position:sticky;top:0;background:var(--card);color:var(--mute);font-weight:600}
.ftab td:first-child,.ftab th:first-child{text-align:left;overflow:hidden;text-overflow:ellipsis}
.modes{display:flex;margin-bottom:8px}
.modes button{flex:1 1 0}
.sctl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:8px}
.sctl label{display:flex;align-items:center;gap:4px}
.sctl input[type=number]{width:76px}
.prog{margin-bottom:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
#pline{font-weight:600;font-size:12px}
#smeta,#preason,#srest{font-size:11px;color:var(--mute);line-height:15px}
#preason{margin-top:2px}
.idx{color:var(--mute);font-variant-numeric:tabular-nums;flex:none;min-width:24px;font-size:11px}
.gd{width:9px;height:9px;border-radius:50%;flex:none;border:1.5px solid var(--mute)}
.gd-ok{background:var(--ok);border-color:var(--ok)}
.gd-bad{background:var(--bad);border-color:var(--bad)}
.gd-none{background:transparent}
.grade{margin-top:6px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.grow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gbtn{min-height:32px;min-width:84px;padding:3px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;font-weight:600}
.gbtn.ok[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--on)}
.gbtn.bad[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--on)}
.gbtn:disabled,#g-clr:disabled{opacity:.45;cursor:not-allowed}
#g-note{flex:1 1 140px;width:auto}
#g-note:disabled{opacity:.5}
.gmsg{font-size:11px;color:var(--mute);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gmsg.bad{color:var(--bad)}
#g-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
#g-tags .chip{min-height:22px;padding:1px 8px;font-size:11.5px}
/* review sets: which set the grades and the sample belong to */
a.btn{text-decoration:none;display:inline-flex;align-items:center;color:var(--ink)}
.setrow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:4px;font-size:12px}
.setlbl{color:var(--mute);flex:none}
.setsel{flex:1 1 60px;max-width:100%;min-width:0;min-height:28px;padding:2px 4px;font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.setrow .btn.sm{min-height:28px;padding:2px 6px;font-size:12px}
.setdir{font-size:11px;line-height:15px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
#setnote{font-size:11px;color:var(--mute);margin-bottom:6px}
.setform{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.setform input[type=text]{flex:1 1 160px}
.fmsg{flex:1 1 100%;font-size:12px;color:var(--mute);line-height:16px}
.fmsg.bad{color:var(--bad)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
@media(max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}.list{max-height:300px}}
@media(max-width:600px){:root{--name:58px}}
</style>
</head>
<body>
<div id="errbar" role="alert" hidden style="position:sticky;top:0;z-index:50;background:#b42318;color:#fff;padding:8px 12px;font:12px/1.4 ui-monospace,monospace">
  <b>Lỗi trang:</b> <span id="errmsg"></span>
  <button type="button" id="errcopy" style="margin-left:8px">Sao chép</button>
  <button type="button" id="errclose" style="margin-left:4px">Đóng</button>
</div>
<main>
<header class="top" id="top"><h1>Nghe hội thoại</h1><a href="./">← Theo dõi job</a></header>
<div class="bar" id="bar">
  <input type="search" id="q" placeholder="Tìm chủ đề, tóm tắt, tên thư mục…" aria-label="Tìm hội thoại" autocomplete="off">
  <select id="sort" aria-label="Sắp xếp">
    <option value="new">Mới nhất</option>
    <option value="long">Dài nhất</option>
    <option value="short">Ngắn nhất</option>
    <option value="name">Tên</option>
  </select>
</div>
<div class="chips" id="chips" role="group" aria-label="Lọc theo loại"></div>
<div class="layout">
  <div class="leftcol">
  <section class="card" aria-label="Đầu vào và đầu ra">
    <div class="iohead">
      <button type="button" class="iotog" id="iotog" aria-expanded="false" aria-controls="iobody">▸ Đầu vào → đầu ra</button>
      <span class="iosum note" id="iosum"></span>
      <button type="button" class="btn sm" id="stats-ref">Làm mới</button>
    </div>
    <div id="iobody" hidden>
      <div class="iorow" id="io-in"></div>
      <div class="iorow" id="io-out"></div>
      <div class="iorow" id="io-ratio"></div>
      <div class="iocat" id="io-cat"></div>
      <div class="tw"><table class="ftab" id="io-films"></table></div>
    </div>
    <div class="err" id="iostatus" role="status"></div>
  </section>
  <section class="card" aria-label="Danh sách hội thoại">
    <div class="seg modes" role="group" aria-label="Chế độ danh sách">
      <button type="button" data-m="list" aria-pressed="true">Danh sách</button>
      <button type="button" data-m="sample" aria-pressed="false">Mẫu nghe thử</button>
    </div>
    <div class="setrow" id="setrow" hidden>
      <span class="setlbl" id="setlbl">Bộ chấm:</span>
      <select id="setsel" class="setsel" aria-label="Bộ chấm"></select>
      <button type="button" class="btn sm" id="setnew">Tạo bộ…</button>
      <a class="btn sm" id="setcsv" href="api/review.csv" download>Tải CSV</a>
      <button type="button" class="btn sm" id="setdel">Xóa bộ</button>
    </div>
    <div class="setdir" id="setdir" hidden></div>
    <div class="setform" id="newform" hidden>
      <input type="text" id="newname" maxlength="60" placeholder="Tên bộ, ví dụ: vòng 2" aria-label="Tên bộ mới" autocomplete="off">
      <label class="note"><input type="checkbox" id="newcopy"> chép 50 mẫu của bộ hiện tại để chấm lại</label>
      <button type="button" class="btn sm primary" id="newok">Tạo</button>
      <button type="button" class="btn sm" id="newcancel">Hủy</button>
      <div class="fmsg" id="newmsg" role="status"></div>
    </div>
    <div class="setform" id="delform" hidden>
      <div class="fmsg" id="delmsg" role="alert"></div>
      <button type="button" class="btn sm danger" id="delok">Xóa hẳn</button>
      <button type="button" class="btn sm" id="delcancel">Hủy</button>
    </div>
    <div class="setform" id="sconfirm" hidden>
      <div class="fmsg" id="sconmsg" role="alert"></div>
      <button type="button" class="btn sm primary" id="sconok">Tiếp tục</button>
      <button type="button" class="btn sm" id="sconnew">Tạo bộ mới</button>
      <button type="button" class="btn sm" id="sconcancel">Hủy</button>
    </div>
    <div id="setnote" hidden></div>
    <div class="sctl" id="sctl" hidden>
      <label class="note">Số lượng <input type="number" id="sn" min="1" max="500" value="50" aria-label="Số lượng mẫu"></label>
      <label class="note">Seed <input type="number" id="sseed" min="0" value="0" aria-label="Seed"></label>
      <button type="button" class="btn sm primary" id="sget">Lấy mẫu</button>
      <button type="button" class="btn sm" id="sshuf">Xáo lại</button>
    </div>
    <div class="prog" id="prog" hidden>
      <div id="smeta"></div>
      <div id="srest" hidden>mẫu khôi phục từ các mục đã chấm trước đây</div>
      <div id="pline"></div>
      <div id="preason"></div>
    </div>
    <div class="list" id="list"><div class="note">đang tải…</div></div>
    <div id="more-wrap"></div>
    <div class="err" id="lstatus" role="status"></div>
  </section>
  </div>
  <section class="card" aria-label="Trình phát">
    <div class="note" id="empty">Chọn một hội thoại ở danh sách bên trái.</div>
    <div id="pbody" hidden>
      <h2 id="ptitle"></h2>
      <div class="note" id="psum"></div>
      <div class="grade" id="grade" hidden>
        <div class="grow">
          <button type="button" class="gbtn ok" id="g-ok" aria-pressed="false">Tốt (1)</button>
          <button type="button" class="gbtn bad" id="g-bad" aria-pressed="false">Lỗi (2)</button>
          <button type="button" class="btn sm" id="g-clr">Bỏ nhãn (0)</button>
          <input type="text" id="g-note" maxlength="300" placeholder="Ghi chú ngắn…" aria-label="Ghi chú" autocomplete="off" disabled>
          <label class="note"><input type="checkbox" id="g-auto"> Tự chuyển</label>
          <span class="gmsg" id="g-msg" role="status"></span>
        </div>
        <div id="g-tags" hidden></div>
      </div>
      <div class="ctrls">
        <button type="button" class="btn primary" id="play">▶ Phát</button>
        <button type="button" class="btn sm" id="back">−5 s</button>
        <button type="button" class="btn sm" id="fwd">+5 s</button>
        <span class="note" id="tcur">0:00 / –</span>
        <select id="rate" aria-label="Tốc độ">
          <option value="0.75">0.75×</option><option value="1">1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option>
        </select>
      </div>
      <div class="ctrls">
        <div class="seg" id="srcs" role="group" aria-label="Nguồn âm thanh"></div>
        <div class="seg" id="chans" role="group" aria-label="Kênh nghe"></div>
        <button type="button" class="btn sm" id="zout" aria-label="Thu nhỏ thời gian">−</button>
        <button type="button" class="btn sm" id="zin" aria-label="Phóng to thời gian">+</button>
        <button type="button" class="btn sm" id="zfit">Vừa khung</button>
      </div>
      <audio id="aud" controls preload="metadata"></audio>
      <div class="lanes" id="lanes">
        <div class="lrow"><div class="lname">mốc</div><canvas class="c-ruler" id="cv-ruler" aria-label="Thước thời gian"></canvas></div>
        <div class="lrow"><div class="lname"><i class="sw" style="background:var(--run)"></i>assistant</div><canvas class="c-wave" id="cv-wa" aria-label="Sóng assistant"></canvas></div>
        <div class="lrow"><div class="lname"></div><canvas class="c-text" id="cv-ta" aria-label="Lời assistant"></canvas></div>
        <div class="lrow"><div class="lname"><i class="sw" style="background:var(--ok)"></i>user</div><canvas class="c-wave" id="cv-wu" aria-label="Sóng user"></canvas></div>
        <div class="lrow"><div class="lname"></div><canvas class="c-text" id="cv-tu" aria-label="Lời user"></canvas></div>
        <div class="lrow" id="row-e" hidden><div class="lname">sự kiện</div><canvas class="c-ev" id="cv-ev" aria-label="Sự kiện"></canvas></div>
        <div class="hrow"><div class="lname"></div><div id="hscroll" aria-label="Thanh cuộn thời gian"><div id="hspacer"></div></div></div>
      </div>
      <div class="err" id="anote" role="alert"></div>
      <div class="note" id="wmsg" role="status"></div>
      <div id="lanetip"></div>
      <div class="tr" id="tr"></div>
      <dl class="dl" id="pinfo"></dl>
    </div>
  </section>
</div>
</main>
<script>
/* any error is shown in a red bar (message, line and the top of the stack) instead of silently freezing the page */
(function () {
  const bar = document.getElementById('errbar'), msg = document.getElementById('errmsg');
  let last = '', count = 0;
  function show(text) {
    if (text === last) { count++; msg.textContent = text + '  (x' + (count + 1) + ')'; return; }
    last = text; count = 0; msg.textContent = text; bar.hidden = false;
  }
  window.__showErr = show;
  window.addEventListener('error', e => show((e.message || 'error') + ' @ ' + String(e.filename || '').split('/').pop() + ':' + e.lineno + ':' + e.colno +
    (e.error && e.error.stack ? '  | ' + e.error.stack.split('\n').slice(0, 4).join(' <- ') : '')));
  window.addEventListener('unhandledrejection', e => show('promesse: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)));
  document.getElementById('errclose').onclick = () => { bar.hidden = true; last = ''; };
  document.getElementById('errcopy').onclick = () => { try { navigator.clipboard.writeText(msg.textContent); } catch (e) {} };
})();

(function () {
'use strict';
const $ = id => document.getElementById(id);
const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const CAT = {interrupt: 'Cắt ngang', backchannel: 'Backchannel', turn_by_turn: 'Lượt lời'};
const CATS = ['interrupt', 'backchannel', 'turn_by_turn'];
const EVT = {backchannel: 'backchannel', merged_backchannel: 'backchannel gộp', interruption: 'cắt ngang', competitive_overlap: 'overlap'};
const SRC = {clean: ['Đã lọc', 'stereo_clean'], orig: ['Gốc', 'stereo'], mix: ['Hỗn hợp', 'mixture']};
const SRC_ORDER = ['clean', 'orig', 'mix'];
const CHAN = [['both', 'Cả hai'], ['assistant', 'Chỉ assistant'], ['user', 'Chỉ user']];
const SORTS = ['new', 'long', 'short', 'name'];
const RATES = [0.75, 1, 1.25, 1.5, 2];

/* ---------- channels (Web Audio) ---------- */
function ensureGraph() {
  if (graph !== 'none') {
    if (actx && actx.state !== 'running') actx.resume().catch(() => {});
    return graph === 'ok';
  }
  const Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) { graph = 'nosupport'; renderChannels(); return false; }
  try {
    actx = new Ctor();
    const src = actx.createMediaElementSource(aud);
    const split = actx.createChannelSplitter(2);
    const merge = actx.createChannelMerger(2);
    gains = [[null, null], [null, null]];
    for (let i = 0; i < 2; i++) {
      for (let e = 0; e < 2; e++) {
        const g = actx.createGain();
        gains[i][e] = g;
        split.connect(g, i);
        g.connect(merge, 0, e);
      }
    }
    src.connect(split);
    merge.connect(actx.destination);
    graph = 'ok';
    applyChannel();
    actx.resume().catch(() => {});
  } catch (err) {
    graph = 'fail';
  }
  renderChannels();
  return graph === 'ok';
}
window.__listenDebug = { gains: () => (gains ? gains.map(r => r.map(x => x.gain.value)) : null), pickChan: k => pickChan(k) };   // for the browser test
/* the mixture is one mono channel: sent as it is to the graph it would play in the left ear only */
function isMonoSource() { return effSrc() === 'mix'; }
function applyChannel() {
  if (!gains) return;
  if (isMonoSource()) {
    for (let i = 0; i < 2; i++) for (let e = 0; e < 2; e++) gains[i][e].gain.value = i === 0 ? 1 : 0;   // channel 0 to both ears
    return;
  }
  const aIdx = assistantIdx();
  for (let i = 0; i < 2; i++) {
    const role = i === aIdx ? 'assistant' : 'user';
    for (let e = 0; e < 2; e++) {
      gains[i][e].gain.value = st.chan === 'both' ? (i === e ? 1 : 0) : (role === st.chan ? 1 : 0);
    }
  }
}

  const wrap = $('chans'), note = $('chnote');

    $('anote').textContent = 'Trình duyệt này không chọn được kênh (không có AudioContext); vẫn nghe cả hai kênh.';

  }
  wrap.hidden = false;
  const mono = isMonoSource();
  wrap.innerHTML = CHAN.map(([k, l]) => '<button type="button" data-k="' + k + '" aria-pressed="' + (mono ? k === 'both' : st.chan === k) + '"' +
    (mono && k !== 'both' ? ' disabled title="Hỗn hợp là một kênh mono: không tách được từng người"' : '') + '>' + l + '</button>').join('');

  if (!CHAN.some(c => c[0] === k) || isMonoSource()) return;

/* ---------- waveform ---------- */
function setWaveMsg(msg) { st.waveMsg = msg; $('wmsg').textContent = msg; }
function envelope(data, rate) {
  const step = rate / BPS, n = Math.ceil(data.length / step);
  const mn = new Float32Array(n), mx = new Float32Array(n);
  for (let b = 0; b < n; b++) {
    const s = Math.floor(b * step), e = Math.min(data.length, Math.max(s + 1, Math.floor((b + 1) * step)));
    let lo = 0, hi = 0;
    for (let i = s; i < e; i++) { const v = data[i]; if (v < lo) lo = v; if (v > hi) hi = v; }
    mn[b] = lo; mx[b] = hi;
  }
  return {mn, mx};
}
async function loadWave(url) {
  const tok = ++st.waveTok;
  st.wave = null;
  if (waveAbort) { waveAbort.abort(); waveAbort = null; }
  if (peakCache.has(url)) { st.wave = peakCache.get(url); setWaveMsg(''); refit(); return; }
  setWaveMsg('đang tải sóng…');
  const ctrl = new AbortController();
  waveAbort = ctrl;
  const chIdx = assistantIdx();
  const bigMsg = 'File lớn hơn 60 MB nên bỏ qua sóng âm; vẫn nghe bình thường.';
  try {
    const r = await fetch(url, {signal: ctrl.signal});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    if (Number(r.headers.get('content-length') || 0) > BIG) {
      ctrl.abort();
      if (tok === st.waveTok) setWaveMsg(bigMsg);
      return;
    }
    const buf = await r.arrayBuffer();
    if (tok !== st.waveTok) return;
    if (buf.byteLength > BIG) { setWaveMsg(bigMsg); return; }
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!OAC) { setWaveMsg('Trình duyệt không giải mã được sóng âm; vẫn nghe bình thường.'); return; }
    const audio = await new OAC(1, 1, 44100).decodeAudioData(buf);
    if (tok !== st.waveTok) return;
    const pick = audio.numberOfChannels >= 2 ? [chIdx, 1 - chIdx] : [0, 0];
    const a = envelope(audio.getChannelData(pick[0]), audio.sampleRate);
    const u = pick[0] === pick[1] ? a : envelope(audio.getChannelData(pick[1]), audio.sampleRate);
    const p = {dur: audio.duration, a: a, u: u};
    if (peakCache.size >= 4) peakCache.delete(peakCache.keys().next().value);
    peakCache.set(url, p);
    st.wave = p;
    setWaveMsg('');
    refit();
  } catch (err) {
    if (tok !== st.waveTok || (err && err.name === 'AbortError')) return;
    setWaveMsg('Không vẽ được sóng âm (' + (err && err.message ? err.message : 'lỗi') + '); vẫn nghe bình thường.');
  }
}

/* ---------- lanes: view, drawing ---------- */
function setSpacer() { hsp.style.width = Math.ceil(totalDur() * pps) + 'px'; }
function clampT0(t) { return Math.max(0, Math.min(t, Math.max(0, totalDur() - trackW() / pps))); }
function panTo(t, quiet) {
  t0 = clampT0(t);
  hs.scrollLeft = t0 * pps;
  if (!quiet) kick();      // frame() pans while it is already drawing: asking for another frame there doubles them every frame
}
function refit() {
  if (!trackW()) return;
  const fit = fitPps();
  if (fitMode) { pps = fit; t0 = 0; }
  else pps = Math.max(pps, fit);
  setSpacer();
  t0 = clampT0(t0);
  hs.scrollLeft = t0 * pps;
  kick();
}
function zoomTo(newPps, anchorT, anchorX) {
  const fit = fitPps(), hi = Math.max(400, fit);
  pps = Math.min(hi, Math.max(fit, newPps));
  fitMode = pps <= fit * 1.0001;
  setSpacer();
  t0 = clampT0(anchorT - anchorX / pps);
  hs.scrollLeft = t0 * pps;
  kick();
}
function zoomCenter(factor) {
  const W = trackW();
  zoomTo(pps * factor, t0 + W / 2 / pps, W / 2);
}
function niceStep(p) {
  for (const s of [1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 1200, 3600]) if (s * p >= 60) return s;
  return 3600;
}
function sizeCv(cv) {
  const W = cv.clientWidth, H = cv.clientHeight;
  const dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) {
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
  }
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  return {g: g, W: W, H: H};
}
function colors() {
  const css = getComputedStyle(document.documentElement);
  const v = n => css.getPropertyValue(n).trim() || '#888';
  return {A: v('--run'), U: v('--ok'), line: v('--line'), ink: v('--ink'), mute: v('--mute'), card: v('--card'), bad: v('--bad'), warn: v('--warn'), sel: v('--sel')};
}
function drawRuler(g, W, H, c) {
  const step = niceStep(pps);
  g.font = LBL;
  g.textBaseline = 'top';
  g.strokeStyle = c.line;
  g.fillStyle = c.mute;
  g.beginPath();
  g.moveTo(0, H - 0.5); g.lineTo(W, H - 0.5); g.stroke();
  for (let t = Math.ceil(t0 / step) * step, guard = 0; (t - t0) * pps < W && guard < 5000; t += step, guard++) {
    const x = Math.round((t - t0) * pps) + 0.5;
    g.beginPath(); g.moveTo(x, H - 5); g.lineTo(x, H); g.stroke();
    g.fillText(fmtTime(t), x + 3, 3);
  }
}
function drawWaveLane(g, W, H, env, color, c, msg) {
  const mid = H / 2, amp = mid - 3;
  g.fillStyle = c.line;
  g.fillRect(0, mid, W, 0.5);
  if (!env) {
    if (msg) { g.font = TXT; g.fillStyle = c.mute; g.textBaseline = 'middle'; g.fillText(msg, 8, mid); }
    return;
  }
  g.fillStyle = color;
  const n = env.mx.length;
  for (let x = 0; x < W; x++) {
    const ta = t0 + x / pps, tb = ta + 1 / pps;
    const i0 = Math.floor(ta * BPS);
    if (i0 >= n) break;
    const i1 = Math.max(i0 + 1, Math.ceil(tb * BPS));
    let lo = 0, hi = 0;
    for (let i = Math.max(0, i0); i < i1 && i < n; i++) {
      if (env.mn[i] < lo) lo = env.mn[i];
      if (env.mx[i] > hi) hi = env.mx[i];
    }
    g.fillRect(x, mid - hi * amp, 1, Math.max(1, (hi - lo) * amp));
  }
}
function turnsOf(role) {
  const out = [];
  st.turns.forEach((t, i) => { if ((t.role === 'user' ? 'user' : 'assistant') === role) out.push({t: t, i: i}); });
  return out;
}
let laneSegs = {assistant: [], user: []};
function drawTextLane(g, W, H, role, c) {
  const color = role === 'user' ? c.U : c.A;
  const cy = H / 2, t1 = t0 + W / pps;
  for (const seg of laneSegs[role]) {
    const s = Number(seg.t.start), e = Number(seg.t.end);
    if (!isFinite(s) || !isFinite(e) || e < t0 || s > t1) continue;
    const x = (s - t0) * pps, bw = Math.max(2, (e - s) * pps);
    const on = seg.i === st.activeTurn;
    g.globalAlpha = on ? 0.32 : 0.13;
    g.fillStyle = color;
    g.fillRect(x, 1, bw, H - 2);
    g.globalAlpha = 1;
    g.fillRect(x, 1, 2, H - 2);
    if (bw < 22) continue;
    const xl = Math.max(x, 0) + 5;
    const xr = x + bw - 3;
    g.font = LBL;
    g.textBaseline = 'middle';
    g.fillStyle = c.mute;
    const label = fmtTime(s);
    g.fillText(label, xl, cy);
    const tx = xl + g.measureText(label).width + 5;
    g.font = TXT;
    g.fillStyle = c.ink;
    g.fillText(fitText(g, seg.t.text || '', xr - tx), tx, cy);
  }
}
function drawEvents(g, W, H, c) {
  const cy = H / 2;
  g.textBaseline = 'middle';
  for (const m of st.evMarks) {
    const x = (m.t - t0) * pps;
    if (x < -60 || x > W) continue;
    const col = m.type === 'interruption' ? c.bad : m.type === 'competitive_overlap' ? c.warn : c.A;
    g.fillStyle = col;
    g.fillRect(x, 0, 1.5, H);
    g.font = LBL;
    g.fillText(fitText(g, m.label, 110), x + 4, cy);
  }
}
function drawPlayhead(g, W, H, c) {
  const px = ((aud.currentTime || 0) - t0) * pps;
  if (px >= 0 && px <= W) { g.fillStyle = c.ink; g.fillRect(px, 0, 1.5, H); }
}
function draw() {
  if (!trackW()) return;
  const c = colors();
  let s = sizeCv(cvR); drawRuler(s.g, s.W, s.H, c); drawPlayhead(s.g, s.W, s.H, c);
  s = sizeCv(cvWA); drawWaveLane(s.g, s.W, s.H, st.wave && st.wave.a, c.A, c, st.waveMsg); drawPlayhead(s.g, s.W, s.H, c);
  s = sizeCv(cvTA); drawTextLane(s.g, s.W, s.H, 'assistant', c); drawPlayhead(s.g, s.W, s.H, c);
  s = sizeCv(cvWU); drawWaveLane(s.g, s.W, s.H, st.wave && st.wave.u, c.U, c, ''); drawPlayhead(s.g, s.W, s.H, c);
  s = sizeCv(cvTU); drawTextLane(s.g, s.W, s.H, 'user', c); drawPlayhead(s.g, s.W, s.H, c);
  if (!$('row-e').hidden) { s = sizeCv(cvEV); drawEvents(s.g, s.W, s.H, c); drawPlayhead(s.g, s.W, s.H, c); }
  $('zfit').textContent = fitMode ? 'Vừa khung' : Math.round(pps) + ' px/s';
}
function updateTime() {
  const d = durationSec();
  $('tcur').textContent = fmtTime(aud.currentTime || 0) + ' / ' + (d ? fmtTime(d) : '–');
}
function frame() {
  raf = 0;
  try {
    const now = aud.currentTime || 0;
    if (!aud.paused && Date.now() > st.manualUntil && trackW() && !fitMode) {     // nothing to follow while the whole file fits
      const x = (now - t0) * pps, W = trackW();
      if (x < 0 || x > W * 0.92) panTo(now - 0.15 * W / pps, true);
    }
    draw();
    updateTime();
    updateActive();
  } catch (e) {
    if (window.__showErr) window.__showErr('frame: ' + (e && e.message) + ' | ' + String((e && e.stack) || '').split('\n').slice(0, 3).join(' <- '));
  }
  if (!aud.paused && !aud.ended && !raf) raf = requestAnimationFrame(frame);     // one pending frame at most; a bad frame must not stop the page
}
function kick() { if (!raf) raf = requestAnimationFrame(frame); }

/* ---------- wiring ---------- */
function bindEvents() {
  let qTimer = 0;
  $('q').addEventListener('input', () => {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => {
      const v = $('q').value.trim();
      if (v === st.q) return;
      st.q = v;
      loadList(true, false);
    }, 250);
  });
  $('sort').addEventListener('change', () => { st.sort = $('sort').value; savePrefs(); loadList(true, false); });
  $('chips').addEventListener('click', e => {
    const b = e.target.closest('.chip');
    if (!b) return;
    st.cat = b.dataset.cat;
    savePrefs();
    renderChips();
    // in sample mode a category change never draws a new sample: the set's sample is fixed until "Lấy mẫu"
  if (st.mode === 'sample') renderChips(); else loadList(true, false);
  });
  $('list').addEventListener('scroll', () => { st.listScrollAt = Date.now(); }, {passive: true});
  $('list').addEventListener('click', e => {
    const r = e.target.closest('.row');
    if (r) selectConv(r.dataset.id);
  });
  $('more-wrap').addEventListener('click', e => { if (e.target.closest('#more')) loadList(false, false); });
  $('lstatus').addEventListener('click', e => {
    if (e.target.closest('#lretry')) loadList(true, false);
    if (e.target.closest('#sretry')) loadSample(st.lastSampleMode);
  });
  $('empty').addEventListener('click', e => { if (e.target.closest('#retry')) selectConv(st.selId); });
  document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.m)));
  $('sget').addEventListener('click', () => requestSample(false));
  $('sshuf').addEventListener('click', () => requestSample(true));
  $('sctl').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') requestSample(false); });
  bindSets();
  $('g-ok').addEventListener('click', () => grade('ok', false));
  $('g-bad').addEventListener('click', () => grade('bad', false));
  $('g-clr').addEventListener('click', () => grade(null, false));
  $('g-tags').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) toggleTag(b.dataset.tag); });
  $('g-note').addEventListener('input', () => {
    const id = st.selId;
    if (!id || !has(st.labels, id)) return;
    st.labels[id].note = $('g-note').value.slice(0, 300);
    pendingNote = {id: id};
    clearTimeout(noteTimer);
    noteTimer = setTimeout(flushNote, 500);
  });
  $('g-auto').addEventListener('change', () => { st.auto = $('g-auto').checked; savePrefs(); });
  $('iotog').addEventListener('click', () => { st.io = !ioOpen(); savePrefs(); renderIoOpen(); if (ioOpen()) loadStats(false); });
  $('stats-ref').addEventListener('click', () => loadStats(true));
  $('srcs').addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if (b) pickSource(b.dataset.k); });
  $('chans').addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if (b) pickChan(b.dataset.k); });
  $('play').addEventListener('click', togglePlay);
  $('back').addEventListener('click', () => seekBy(-5));
  $('fwd').addEventListener('click', () => seekBy(5));
  $('zin').addEventListener('click', () => zoomCenter(1.5));
  $('zout').addEventListener('click', () => zoomCenter(1 / 1.5));
  $('zfit').addEventListener('click', () => { fitMode = true; refit(); });
  $('rate').addEventListener('change', () => {
    st.rate = Number($('rate').value) || 1;
    aud.playbackRate = st.rate;
    savePrefs();
  });
  $('rate').value = String(st.rate);

  // one click or tap on any lane seeks to that time; a text lane also shows the full line below
  [cvR, cvWA, cvTA, cvWU, cvTU, cvEV].forEach(cv => {
    cv.addEventListener('click', e => {
      const r = cv.getBoundingClientRect();
      const x = e.clientX - r.left;
      seek(t0 + x / pps);
      if (cv === cvTA || cv === cvTU) {
        const t = t0 + x / pps;
        const hit = laneSegs[cv === cvTA ? 'assistant' : 'user'].find(s => t >= Number(s.t.start) && t <= Number(s.t.end));
        if (hit) $('lanetip').textContent = fmtTime(hit.t.start) + ' ' + (cv === cvTA ? 'assistant' : 'user') + ': ' + (hit.t.text || '');
      }
    });
    cv.addEventListener('pointermove', e => {
      const r = cv.getBoundingClientRect();
      const t = t0 + (e.clientX - r.left) / pps;
      if (cv === cvTA || cv === cvTU) {
        const hit = laneSegs[cv === cvTA ? 'assistant' : 'user'].find(s => t >= Number(s.t.start) && t <= Number(s.t.end));
        const tip = hit ? fmtTime(hit.t.start) + ' ' + (hit.t.role || '') + ': ' + (hit.t.text || '') : '';
        if (cv.title !== tip) cv.title = tip;
      }
    });
  });
  // Ctrl/Cmd + wheel zooms the lanes around the pointer; plain horizontal wheel pans; vertical wheel scrolls the page
  lanesEl.addEventListener('wheel', e => {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      const r = cvR.getBoundingClientRect();
      const x = Math.min(Math.max(e.clientX - r.left, 0), trackW());
      const dy = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaY;
      zoomTo(pps * Math.exp(-dy * 0.0015), t0 + x / pps, x);
    } else if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
      e.preventDefault();
      hs.scrollLeft += e.deltaX;
      st.manualUntil = Date.now() + 4000;
    }
  }, {passive: false});
  hs.addEventListener('scroll', () => { t0 = hs.scrollLeft / pps; kick(); }, {passive: true});
  hs.addEventListener('pointerdown', () => { st.manualUntil = Date.now() + 4000; });
  const tr = $('tr');
  tr.addEventListener('click', e => {
    const b = e.target.closest('.turn');
    if (!b) return;
    const t = st.turns[Number(b.dataset.i)];
    if (!t) return;
    seek(Number(t.start) || 0);
    if (aud.paused) aud.play().catch(playErr);
  });
  tr.addEventListener('wheel', () => { st.manualUntil = Date.now() + 5000; }, {passive: true});
  tr.addEventListener('touchmove', () => { st.manualUntil = Date.now() + 5000; }, {passive: true});

  aud.addEventListener('play', () => { ensureGraph(); if (actx && actx.state !== 'running') actx.resume().catch(() => {}); syncPlayBtn(); kick(); });
  aud.addEventListener('pause', () => { syncPlayBtn(); kick(); });
  aud.addEventListener('ended', () => { syncPlayBtn(); kick(); });
  aud.addEventListener('seeked', kick);
  aud.addEventListener('timeupdate', kick);
  aud.addEventListener('loadedmetadata', kick);
  aud.addEventListener('error', () => {
    if (aud.error && st.audioUrl) $('anote').textContent = 'Không tải được file âm thanh này.';
    kick();
  });

  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const t = e.target;
    if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT|AUDIO)$/.test(t.tagName))) return;
    if (e.key === ' ') {
      if (t && (t.tagName === 'BUTTON' || t.tagName === 'A')) return;
      e.preventDefault();
      togglePlay();
    } else if (e.key === 'ArrowLeft') { e.preventDefault(); seekBy(-5); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); seekBy(5); }
    else if ((e.key === '1' || e.key === '2' || e.key === '0') && gradeVisible()) {
      e.preventDefault();
      if (e.key === '0') grade(null, false);
      else grade(e.key === '1' ? 'ok' : 'bad', $('g-auto').checked && st.mode === 'sample');
    }
    else if (e.key === 'j') { stepConv(-1); }
    else if (e.key === 'k') { stepConv(1); }
    else if (e.key === '+' || e.key === '=') { zoomCenter(1.5); }
    else if (e.key === '-' || e.key === '_') { zoomCenter(1 / 1.5); }
  });
  window.addEventListener('resize', refit);
  const mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
  if (mq && mq.addEventListener) mq.addEventListener('change', kick);
}
function init() {
  let inFrame = false;
  try { inFrame = window.self !== window.top; } catch (e) { inFrame = true; }
  if (inFrame) document.body.classList.add('embedded');
  loadPrefs();
  $('sort').value = st.sort;
  $('rate').value = String(st.rate);
  aud.playbackRate = st.rate;
  $('g-auto').checked = st.auto;
  renderChips();
  renderChannels();
  bindEvents();
  applyModeUi();
  loadList(true, st.mode === 'sample');
  setsReady = loadSets().then(() => {       // labels and the sample depend on the set, so they wait for the set list
    loadReview();
    if (st.mode === 'sample') loadSample('saved');
  });
  loadStats(false);     // the collapsed header shows the totals too
  if (st.selId) selectConv(st.selId);
  setInterval(refresh, 20000);
  kick();
}
init();
})();
</script>
</body>
</html>
